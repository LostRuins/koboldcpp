name: KoboldCpp Linux ROCm

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''
      tag_name:
        description: 'Optional version tag (e.g. v1.57.1) for stable release file'
        required: false
        default: ''

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    permissions: write-all
    steps:
      - name: Show runner hardware
        shell: bash
        run: |
          echo "::group::GitHub runner"
          echo "Name: ${RUNNER_NAME:-unknown}"
          echo "OS/architecture: ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "::endgroup::"
          echo "::group::Machine and operating system"
          uname -a
          for item in sys_vendor product_name product_version; do
            file="/sys/class/dmi/id/$item"
            if [ -r "$file" ]; then printf '%s: ' "$item"; cat "$file"; fi
          done
          echo "::endgroup::"
          echo "::group::CPU"
          if command -v lscpu >/dev/null 2>&1; then lscpu; else cat /proc/cpuinfo; fi
          echo "Online processors: $(getconf _NPROCESSORS_ONLN)"
          echo "::endgroup::"
          echo "::group::Memory"
          grep -E '^Mem(Total|Available|Free):' /proc/meminfo
          awk '/^MemTotal:/ { printf "RAM visible to the OS: %d KiB (%.2f GiB)\n", $2, $2 / 1048576 }' /proc/meminfo
          for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            if [ -r "$file" ]; then printf 'Cgroup memory limit (%s): ' "$file"; cat "$file"; fi
          done
          echo "::endgroup::"

      - name: Free up disk space before container
        run: |
          echo "Cleaning up runner to make room for ROCm container..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}"

      - name: Build inside ROCm container
        run: |
          docker run --privileged \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e KCPP_CUDA="rocm" \
            -e KCPP_PORTABLE="1" \
            -e BRANCH_NAME="${{ github.head_ref || github.ref_name }}" \
            rocm/dev-ubuntu-22.04:7.14.0-full \
            bash -c "
              apt update &&
              DEBIAN_FRONTEND=noninteractive apt install -y git curl bzip2 python3-tk tcl tk &&
              export TCL_LIBRARY=\$(find /usr/lib/ -name 'tcl8*' | head -n 1) &&
              export TK_LIBRARY=\$(find /usr/lib/ -name 'tk8*' | head -n 1) &&
              ./koboldcpp.sh dist
            "

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: kcpp_linux_binary
          path: ${{ github.workspace }}/dist/

      - name: Upload to GitHub Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload rocm-rolling dist/koboldcpp-linux-x64-rocm --clobber

      - name: Upload version pinned tagged binary
        if: ${{ inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          cp dist/koboldcpp-linux-x64-rocm "dist/koboldcpp-linux-x64-rocm-${TAG_NAME}"
          gh release upload rocm-rolling "dist/koboldcpp-linux-x64-rocm-${TAG_NAME}" --clobber
