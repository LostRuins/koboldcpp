name: Koboldcpp Linux ARM64

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  linux-arm:
    runs-on: ubuntu-latest
    steps:
      - name: Show runner hardware
        shell: bash
        run: |
          echo "::group::GitHub runner"
          echo "Name: ${RUNNER_NAME:-unknown}"
          echo "OS/architecture: ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "::endgroup::"
          echo "::group::Machine and operating system"
          uname -a
          for item in sys_vendor product_name product_version; do
            file="/sys/class/dmi/id/$item"
            if [ -r "$file" ]; then printf '%s: ' "$item"; cat "$file"; fi
          done
          echo "::endgroup::"
          echo "::group::CPU"
          if command -v lscpu >/dev/null 2>&1; then lscpu; else cat /proc/cpuinfo; fi
          echo "Online processors: $(getconf _NPROCESSORS_ONLN)"
          echo "::endgroup::"
          echo "::group::Memory"
          grep -E '^Mem(Total|Available|Free):' /proc/meminfo
          awk '/^MemTotal:/ { printf "RAM visible to the OS: %d KiB (%.2f GiB)\n", $2, $2 / 1048576 }' /proc/meminfo
          for file in /sys/fs/cgroup/memory.max /sys/fs/cgroup/memory/memory.limit_in_bytes; do
            if [ -r "$file" ]; then printf 'Cgroup memory limit (%s): ' "$file"; cat "$file"; fi
          done
          echo "::endgroup::"

      - name: Clone
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}"

      - name: Install Dependencies
        id: depends
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-pip python3-dev build-essential \
              libffi-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev \
              crossbuild-essential-arm64 gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install New GCC for Cross-Compilation
        run: |
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 gcc-12-aarch64-linux-gnu g++-12-aarch64-linux-gnu
          export CC=/usr/bin/aarch64-linux-gnu-gcc-12
          export CXX=/usr/bin/aarch64-linux-gnu-g++-12
          export AR=aarch64-linux-gnu-ar
          export UNAME_M=aarch64
          export UNAME_S=Linux
          export PATH=/usr/bin:$PATH
          make LLAMA_PORTABLE=1
          chmod +x './kcpp_src/packaging/create_ver_file.sh'
          . "./kcpp_src/packaging/create_ver_file.sh"
          mkdir -p dist
          cp './koboldcpp_default.so' dist
          ls

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support

      - name: Setup QEMU for ARM64
        run: |
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes

      - name: Build ARM64 PyInstaller
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "${PWD}:/src" \
            python:3.9-slim \
            /bin/bash -c "
              apt-get update && apt-get install -y build-essential && \
              apt-get update && apt-get install -y gcc-12 g++-12 && \
              export LD_LIBRARY_PATH=/usr/lib/gcc/x86_64-linux-gnu/12:$LD_LIBRARY_PATH && \
              pip install customtkinter pyinstaller tk jinja2 && \
              cd /src && \
              pyinstaller --noconfirm --onefile --collect-all customtkinter --collect-all jinja2 --collect-all psutil \
              --add-data './koboldcpp_default.so:.' \
              --add-data './kcpp_adapters:./kcpp_adapters' \
              --add-data './koboldcpp.py:.' \
              --add-data './kcpp_src/json_to_gbnf.py:.' \
              --add-data './LICENSE.md:.'  \
              --add-data './ggml/src/GGML_LICENSE:./vendor_licenses'  \
              --add-data './otherarch/acestep/ACESTEP_LICENSE:./vendor_licenses'  \
              --add-data './otherarch/audiocpp/upstream/AUDIOCPP_LICENSE:./vendor_licenses'  \
              --add-data './otherarch/qwen3tts/QWEN3TTS_LICENSE:./vendor_licenses'  \
              --add-data './otherarch/sdcpp/SDCPP_LICENSE:./vendor_licenses'  \
              --add-data './otherarch/ttscpp/TTSCPP_LICENSE:./vendor_licenses'  \
              --add-data './src/LLAMACPP_LICENSE:./vendor_licenses'  \
              --add-data './embd_res:./embd_res' \
              --version-file './kcpp_src/packaging/version.txt' \
              --clean --console koboldcpp.py -n 'koboldcpp-linux-arm64'
            "

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: kcpp_linux_arm64_binary
          path: dist/

