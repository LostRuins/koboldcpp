name: Koboldcpp Mac

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Optional commit hash to build from'
        required: false
        default: ''

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  osx:
    runs-on: macos-15
    permissions: write-all
    steps:
      - name: Show runner hardware
        shell: bash
        run: |
          echo "::group::GitHub runner"
          echo "Name: ${RUNNER_NAME:-unknown}"
          echo "OS/architecture: ${RUNNER_OS:-unknown} / ${RUNNER_ARCH:-unknown}"
          echo "Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "::endgroup::"
          echo "::group::Machine and operating system"
          sw_vers
          uname -a
          system_profiler SPHardwareDataType | awk '/Model Name:|Model Identifier:|Chip:|Processor Name:|Processor Speed:|Number of Processors:|Total Number of Cores:|Memory:/'
          echo "::endgroup::"
          echo "::group::CPU"
          sysctl -n machdep.cpu.brand_string 2>/dev/null || true
          echo "Physical CPU cores: $(sysctl -n hw.physicalcpu)"
          echo "Logical CPU cores: $(sysctl -n hw.logicalcpu)"
          echo "::endgroup::"
          echo "::group::Memory"
          memory_bytes=$(sysctl -n hw.memsize)
          echo "Installed RAM: ${memory_bytes} bytes"
          awk -v bytes="$memory_bytes" 'BEGIN { printf "Installed RAM: %.2f GiB\n", bytes / 1073741824 }'
          vm_stat
          echo "::endgroup::"

      - name: Clone
        id: checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}

      - name: Show Commit Used
        run: |
          echo "Building from ref: ${{ inputs.commit_hash != '' && inputs.commit_hash || github.head_ref || github.ref_name }}"

      - name: Dependencies
        id: depends
        run: |
          pip install customtkinter pyinstaller tk jinja2

      - name: Build
        id: make_build
        run: |
          make LLAMA_METAL=1 koboldcpp_default
          mkdir -p build_artifacts
          mv koboldcpp_default.so build_artifacts/
          make clean
          make koboldcpp_macos_failsafe
          mv koboldcpp_macos_failsafe.so koboldcpp_failsafe.so
          mv build_artifacts/koboldcpp_default.so .
          chmod +x './kcpp_src/packaging/create_ver_file.sh'
          . "./kcpp_src/packaging/create_ver_file.sh"
          mkdir -p kernels
          cp ggml/src/ggml-metal/kernels/*.metal ggml/src/ggml-metal/kernels/*.h kernels/
          cp ggml/src/ggml-common.h ggml/src/ggml-metal/ggml-metal-impl.h kernels/
          pyinstaller --noconfirm --onefile --collect-all customtkinter --collect-all jinja2 --collect-all psutil --add-data './koboldcpp_default.so:.' --add-data './koboldcpp_failsafe.so:.' --add-data './kernels:./kernels' --add-data './kcpp_adapters:./kcpp_adapters' --add-data './koboldcpp.py:.' --add-data './kcpp_src/json_to_gbnf.py:.' --add-data './LICENSE.md:.' --add-data './ggml/src/GGML_LICENSE:./vendor_licenses' --add-data './otherarch/acestep/ACESTEP_LICENSE:./vendor_licenses' --add-data './otherarch/audiocpp/upstream/AUDIOCPP_LICENSE:./vendor_licenses' --add-data './otherarch/qwen3tts/QWEN3TTS_LICENSE:./vendor_licenses' --add-data './otherarch/sdcpp/SDCPP_LICENSE:./vendor_licenses' --add-data './otherarch/ttscpp/TTSCPP_LICENSE:./vendor_licenses' --add-data './src/LLAMACPP_LICENSE:./vendor_licenses' --add-data './embd_res:./embd_res' --version-file './kcpp_src/packaging/version.txt' --clean --console koboldcpp.py -n "koboldcpp-mac-arm64"

      - name: Test
        id: test
        run: |
          wget https://huggingface.co/concedo/koboldcpp/resolve/main/baby_llama.gguf
          dist/koboldcpp-mac-arm64 --model baby_llama.gguf --gpulayers 99 --benchmark --prompt 'Once upon a'

      - name: Save artifact
        uses: actions/upload-artifact@v6
        with:
          name: kcpp_mac_binary
          path: dist/

      - name: Upload to GitHub Rolling Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload rolling dist/koboldcpp-mac-arm64 --clobber
