name: "💡 Feature Request"
description: Suggest an idea for this project
title: "feat: "
labels: ["enhancement"]

body:
  - type: textarea
    id: feature-problem-description
    attributes:
      label: Feature Description
      description: Is your feature request related to a problem? Please provide a clear description of what the problem is.
      placeholder: "Ex. It's annoying when..."
    validations:
      required: true
  - type: textarea
    id: feature-solution-description
    attributes:
      label: Desired Solution
      description: Clearly describe what you want to happen.
    validations:
      required: true

  - type: textarea
    id: feature-additional-context
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
